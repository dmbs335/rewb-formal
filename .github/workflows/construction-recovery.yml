name: Construction recovery kernel checks
on:
  push:
    branches:
      - formalization/construction-recovery-20261125
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovered-kernel:
    name: Recovered kernel (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: initial-and-join
            targets: REWB.MaskedAllStartFullCostInitial REWB.PeriodicActualJoinCost
            audit: audits/recovery_root_axioms.lean
          - group: periodic-actual
            targets: REWB.PeriodicActualPrepareCost REWB.PeriodicActualP2Cost
            audit: audits/recovery_periodic_axioms.lean
          - group: finite-cut
            targets: REWB.PeriodicConstructionCutRegression
            audit: audits/periodic_cut_construction_axioms.lean
          - group: finite-initial
            targets: REWB.MaskedAllStartFullCost
            audit: audits/recovery_finite_initial_axioms.lean
          - group: full-executor
            targets: REWB.MaskedAllStartFullCostExecute
            audit: audits/recovery_execution_axioms.lean
          - group: periodic-branch
            targets: REWB.PeriodicActualBranchCost
            audit: audits/periodic_actual_branch_cost_axioms.lean
          - group: periodic-residual
            targets: REWB.ResidualActualPeriodicCost
            audit: audits/residual_actual_periodic_cost_axioms.lean
          - group: full-rows
            targets: REWB.MaskedAllStartFullCostTable
            audit: audits/recovery_full_rows_axioms.lean
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        run: |
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: ${{ runner.os }}-lean-4-19-recovery-${{ matrix.group }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-lean-4-19-recovery-${{ matrix.group }}-
            ${{ runner.os }}-lean-4-19-recovery-initial-and-join-
      - name: Reject incomplete proof constructs
        run: |
          if grep -nE '\b(sorry|admit|sorryAx|native_decide)\b|^[[:space:]]*(axiom|constant)[[:space:]]' REWB.lean REWB/*.lean; then
            echo 'Untrusted or incomplete proof construct detected.' >&2
            exit 1
          fi
      - name: Build recovered sources
        run: lake build ${{ matrix.targets }}
      - name: Audit recovered theorem dependencies
        run: |
          set -euo pipefail
          lake env lean ${{ matrix.audit }} | tee /tmp/recovery-axioms.log
          if grep -q sorryAx /tmp/recovery-axioms.log; then
            echo 'Unexpected proof dependency.' >&2
            exit 1
          fi
      - name: Compare actual chronological join execution
        if: matrix.group == 'initial-and-join'
        run: lake env lean --run audits/periodic_actual_join_smoke.lean
      - name: Audit actual periodic branch value theorems
        if: matrix.group == 'periodic-branch'
        run: lake env lean audits/periodic_actual_branch_axioms.lean
      - name: Compare measured finite cut execution
        if: matrix.group == 'finite-cut'
        run: lake env lean --run audits/periodic_cut_construction_smoke.lean
      - name: Compare actual periodic branch execution
        if: matrix.group == 'periodic-branch'
        run: lake env lean --run audits/periodic_actual_smoke.lean
      - name: Audit actual periodic residual value theorems
        if: matrix.group == 'periodic-residual'
        run: lake env lean audits/residual_actual_periodic_axioms.lean
      - name: Inspect full-cost execution generated code
        if: matrix.group == 'full-executor'
        run: python3 audits/masked_full_cost_execution_codegen.py
      - name: Save compiled recovery dependencies
        if: always() && !cancelled()
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: ${{ runner.os }}-lean-4-19-recovery-${{ matrix.group }}-${{ github.sha }}
